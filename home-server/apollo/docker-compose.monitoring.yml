services:
# Last updated: 07/11/2026 12:38 PM
  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    ports:
      - 9100:9100
    command:
      - "--path.rootfs=/host"
    pid: host
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"
    networks: [internal]
    labels:
      dynacat.name: Node Exporter
      dynacat.category: Monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
    - 8070:8080
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    networks: [internal]
    labels:
      dynacat.name: CAdvisor
      dynacat.icon: sh:cadvisor
      dynacat.category: Monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./containers/prometheus/config:/config
      - ./containers/prometheus/data:/prometheus
    restart: unless-stopped
    command:
      - "--config.file=/config/prometheus.yml"
    networks: [internal]
    # labels:
    #   dynacat.name: Prometheus
    #   dynacat.icon: si:prometheus
    #   dynacat.category: Monitoring
    #   dyncat.url: https://prom.vathzen.in

networks:
  internal:
    external: true
    name: apollo_internal