services:
# Last updated: 03/11/2026 2:38 PM
  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    command:
      - "--path.rootfs=/host"
    pid: host
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"
    networks: [internal]
    labels:
      dynacat.name: Node Exporter
      dynacat.category: Monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
    - 8070:8080
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    networks: [internal]
    labels:
      dynacat.name: CAdvisor
      dynacat.icon: sh:cadvisor
      dynacat.category: Monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./containers/prometheus/config:/config
      - ./containers/prometheus/data:/prometheus
    restart: unless-stopped
    command:
      - "--config.file=/config/prometheus.yml"
    networks: [internal]
    labels:
      dynacat.name: Prometheus
      dynacat.icon: si:prometheus
      dynacat.category: Monitoring
      dyncat.url: https://prom.vathzen.in

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./containers/grafana:/var/lib/grafana
    restart: unless-stopped
    networks: [internal]
    labels:
      dynacat.name: Grafana
      dynacat.icon: si:grafana
      dynacat.category: Monitoring
      dynacat.url: https://grafana.vathzen.in

  dynacat:
    container_name: dynacat
    image: panonim/dynacat
    restart: unless-stopped
    volumes:
      - ./containers/dynacat/config:/app/config
      - ./containers/dynacat/assets:/app/assets
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - 8050:8080
    env_file: ./containers/dynacat/.env
    networks: [internal]
    labels:
      dynacat.name: Dynacat
      dynacat.icon: sh:dynacat
      dynacat.category: Monitoring
      dynacat.url: https://home.vathzen.in

networks:
  internal:
    external: true
    name: olympus_internal