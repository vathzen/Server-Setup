- name: Home
  hide-desktop-navigation: false
  columns:
    - size: full
      widgets:
        - type: split-column
          max-columns: 3
          widgets:
            - type: clock
              hour-format: 24h
              timezones:
                - timezone: Europe/Helsinki
                  label: Home
                - timezone: Asia/Calcutta
                  label: Chennai
                - timezone: America/Los_Angeles
                  label: California
            - type: speedtest
              frameless: true
    - size: small
      widgets:
        - type: weather
          location: Espoo, Finland
          units: metric
          hour-format: 24h
          # Optionally hide the location from being displayed in the widget
          # hide-location: true
        - type: markets
          markets:
            - name: NIFTY 50
              symbol: ^NSEI
              chart-link: https://www.tradingview.com/chart/?symbol=INDEX:NIFTY
        - type: server-stats
          title: Artemis