- name: Home
  hide-desktop-navigation: true
  columns:
    - size: full
      widgets:
        - type: split-column
          max-columns: 3
          widgets:
            - type: clock
              hour-format: 24h
              timezones:
                - timezone: Europe/Helsinki
                  label: Home
                - timezone: Asia/Calcutta
                  label: Chennai
            - type: speedtest
              frameless: true
        - type: split-column
          max-columns: 6
          title: Containers
          widgets:
            - type: docker-containers
              category: Media
              title: Media
            - type: split-column
              frameless: true
              max-columns: 1
              widgets:
                - type: docker-containers
                  category: Applications
                  frameless: true
                  title: Applications
                - type: docker-containers
                  running-only: true
                  category: Monitoring
                  title: Monitoring
            - type: split-column
              frameless: true
              max-columns: 1
              widgets:
                - type: docker-containers
                  category: Infrastructure
                  frameless: true
                  running-only: true
                  title: Infrastructure
                - type: docker-containers
                  category: SparkyFitness
                  frameless: true
                  title: Sparky Fitness
    - size: small
      widgets:
        - type: weather
          location: Espoo, Finland
          units: metric
          hour-format: 24h
          # Optionally hide the location from being displayed in the widget
          # hide-location: true
        - type: markets
          markets:
            - name: NIFTY 50
              symbol: ^NSEI
              chart-link: https://www.tradingview.com/chart/?symbol=INDEX:NIFTY
        - type: server-stats
          title: Artemis
