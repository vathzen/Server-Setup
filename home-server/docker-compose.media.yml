services:
# Last updated: 03/11/2026 2:21 PM
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Helsinki
    volumes:
      - ./containers/sonarr/config:/config
      - /mnt/cornucopia:/data
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks: [internal]
    labels:
      dynacat.name: Sonarr
      dynacat.icon: si:sonarr
      dynacat.category: Media
      dynacat.url: https://sonarr.vathzen.in

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Helsinki
    volumes:
      - ./containers/radarr/config:/config
      - /mnt/cornucopia:/data
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks: [internal]
    labels:
      dynacat.name: Radarr
      dynacat.icon: si:radarr
      dynacat.category: Media
      dynacat.url: https://radarr.vathzen.in

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Helsinki
    volumes:
      - ./containers/bazarr/config:/config
      - /mnt/cornucopia:/data
    ports:
      - "6767:6767"
    restart: unless-stopped
    networks: [internal]
    labels:
      dynacat.name: Bazarr
      dynacat.icon: sh:bazarr-dark
      dynacat.category: Media
      dynacat.url: https://bazarr.vathzen.in

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Helsinki
    volumes:
      - ./containers/prowlarr/config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks: [internal]
    labels:
      dynacat.name: Prowlarr
      dynacat.icon: sh:prowlarr-dark
      dynacat.category: Media
      dynacat.url: https://prowlarr.vathzen.in

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    environment:
      - TZ=Europe/Helsinki
      - LOG_LEVEL=info
    ports:
      - "8191:8191"
    restart: unless-stopped
    networks: [internal]
    labels:
      dynacat.name: Byparr
      dynacat.icon: sh:byparr-dark
      dynacat.category: Media
      dynacat.url: https://byparr.vathzen.in

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Helsinki
      - WEBUI_PORT=8082
    volumes:
      - ./containers/qbittorrent/config:/config
      - /mnt/cornucopia:/data
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_started
    restart: unless-stopped
    labels:
      dynacat.name: QBittorrent
      dynacat.icon: si:qbittorrent
      dynacat.category: Media
      dynacat.url: https://qbit.vathzen.in

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Helsinki
      - JELLYFIN_PublishedServerUrl=https://tv.vathzen.in
    volumes:
      - ./containers/jellyfin/config:/config
      - /mnt/cornucopia/media:/data/media:ro
    ports:
      - "8096:8096"
      - "7359:7359/udp"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "992"
    restart: unless-stopped
    networks: [internal]
    labels:
      dynacat.name: Jellyfin
      dynacat.icon: si:jellyfin
      dynacat.category: Media
      dynacat.url: https://tv.vathzen.in

networks:
  internal:
    external: true
    name: olympus_internal